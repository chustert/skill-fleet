name: Publish

# Pushing a tag such as v1.1.0 tests the package and publishes that version to
# npm through trusted publishing, so no npm token is stored in this repository.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm version that supports trusted publishing
        run: npm install --global npm@11.20.0
      - run: npm test
      - name: Check that the tag matches the package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version." >&2
            exit 1
          fi
      - name: Publish to npm
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "skill-fleet@$version" version >/dev/null 2>&1; then
            echo "skill-fleet@$version is already published."
          else
            npm publish
          fi

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
