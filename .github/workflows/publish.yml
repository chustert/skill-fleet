name: Publish

# Pushing a tag such as v1.1.0 tests the package and stages that version on npm
# through trusted publishing, so no npm token is stored in this repository. A
# staged version goes live only after a maintainer approves it on npmjs.com
# with two-factor authentication, so this workflow alone can never publish.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm version that supports staged, trusted publishing
        run: npm install --global npm@11.20.0
      - run: npm test
      - name: Check that the tag matches the package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version." >&2
            exit 1
          fi
      - name: Stage the release on npm
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "skill-fleet@$version" version >/dev/null 2>&1; then
            echo "skill-fleet@$version is already published."
          else
            npm stage publish
            {
              echo "## skill-fleet@$version is staged on npm"
              echo
              echo "It goes live only after a maintainer approves it with two-factor authentication:"
              echo
              echo "- on npmjs.com, in the package's **Staged Packages** tab, or"
              echo "- with \`npm stage list skill-fleet\`, then \`npm stage approve <stage-id>\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
